<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>딱만큼 프로토타입</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf9f2;--card:#fff;--soft:#eef4e6;--ink:#1f2a22;--mute:#6b7569;--g:#2f6b3f;--g2:#7fb85a;--warn:#f0931f;--red:#c23a2b;--redbg:#fde8e4;--line:#e3e6da;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141a15;--card:#1d261f;--soft:#26332a;--ink:#eef2ea;--mute:#9aa596;--g:#7fcf8e;--g2:#7fb85a;--line:#2e3a31;--redbg:#3a2220}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141a15;--card:#1d261f;--soft:#26332a;--ink:#eef2ea;--mute:#9aa596;--g:#7fcf8e;--g2:#7fb85a;--line:#2e3a31;--redbg:#3a2220}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;display:flex;justify-content:center}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column}
.note{font-size:11px;text-align:center;color:var(--mute);padding:4px;background:var(--soft)}
main{flex:1;overflow-y:auto;padding:16px 16px 24px}
h1{font-size:26px;font-weight:900;color:var(--g);letter-spacing:-.5px}
h2{font-size:20px;font-weight:900;margin-bottom:4px}
.sub{color:var(--mute);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ing{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;font-weight:700;font-size:14px}
.ing .e{font-size:34px;display:block}
.d{display:inline-block;background:var(--warn);color:#fff;border-radius:99px;padding:1px 10px;font-size:12px;margin-top:4px}
.d.ok{background:var(--g2)}
.q{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.q button{background:var(--soft);border:0;border-radius:14px;padding:10px 2px;font:600 12px 'Noto Sans KR',sans-serif;color:var(--ink);cursor:pointer}
.q b{display:block;font-size:22px}
.btn{width:100%;background:var(--g);color:var(--bg);border:0;border-radius:99px;padding:14px;font:700 16px 'Noto Sans KR',sans-serif;cursor:pointer}
.btn.o{background:transparent;border:1.5px solid var(--g);color:var(--g)}
.btn.s{padding:9px;font-size:14px}
.seg{display:flex;background:var(--soft);border-radius:99px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:99px;padding:9px 4px;font:600 13px 'Noto Sans KR',sans-serif;color:var(--mute);cursor:pointer}
.seg button.on{background:var(--g);color:var(--bg)}
.tag{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.red{background:var(--redbg);color:var(--red)}.grn{background:var(--soft);color:var(--g)}
.big{font-size:44px}
.ring{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--g2) calc(var(--p)*1%),var(--line) 0)}
.ring i{width:74px;height:74px;border-radius:50%;background:var(--card);display:grid;place-items:center;font:900 20px 'Noto Sans KR',sans-serif;font-style:normal}
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px}
.bars div{flex:1;background:var(--g2);opacity:.55;border-radius:6px 6px 0 0}.bars div:last-child{opacity:1;background:var(--g)}
.lab{display:flex;gap:6px;font-size:11px;color:var(--mute);text-align:center}.lab span{flex:1}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{border:0;background:transparent;color:var(--mute);font:600 11px 'Noto Sans KR',sans-serif;padding:6px 0;border-radius:12px;cursor:pointer}
nav button.on{color:var(--g);background:var(--soft)}nav span{display:block;font-size:20px}
.chk{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border:0}.chk .grow{flex:1;font-weight:700}
.scan{height:150px;border-radius:14px;background:repeating-linear-gradient(135deg,#d9c9a8,#d9c9a8 10px,#cfbd98 10px,#cfbd98 20px);display:grid;place-items:center;position:relative;overflow:hidden;margin-bottom:12px;font-weight:700;color:#5a4a2a}
.scan.go::after{content:"";position:absolute;left:0;right:0;height:3px;background:#5fd07a;box-shadow:0 0 12px #5fd07a;animation:sc 1.1s linear}
@keyframes sc{from{top:0}to{top:100%}}
@media (prefers-reduced-motion:reduce){.scan.go::after{animation:none}}
.opt{border:2px solid var(--line);border-radius:16px;padding:12px;cursor:pointer;background:var(--card)}
.opt.on{border-color:var(--g);background:var(--soft)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;max-width:90%}
</style>
</head>
<body>
<div id="app">
  <div class="note">프로토타입 · 샘플 데이터 (OCR·AI는 시뮬레이션)</div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<script>
var S={tab:'home',view:'',sub:'prio',sit:0,buy:'one',range:'week',scanned:false,cart:0,saved:12400,kg:1.2,
items:[{n:'상추',e:'🥬',d:1},{n:'토마토',e:'🍅',d:2},{n:'두부',e:'🧊',d:3},{n:'딸기',e:'🍓',d:4},{n:'버섯',e:'🍄',d:4},{n:'계란',e:'🥚',d:9}],
rc:[{n:'우유',e:'🥛',q:'1개',d:5,p:2800,on:1},{n:'양파',e:'🧅',q:'1개',d:14,p:1200,on:1},{n:'대파',e:'🌿',q:'1단',d:6,p:1800,on:1}]};
var TABS=[['home','🏠','홈'],['stock','🧊','식재료'],['recipe','🍳','레시피'],['buy','🛒','구매추천'],['report','📊','리포트']];
var REC=[{t:'두부 토마토 볶음',m:'약 10분 · 아주 쉬움',e:'🍲',s:'집에서 식사',x:['토마토 두부 샐러드','토마토 계란볶음','두부 토마토 스튜']},
{t:'상추 토마토 샌드위치',m:'약 5분 · 아주 쉬움',e:'🥪',s:'시간이 부족해요',x:['토마토 주스','상추 계란말이']},
{t:'내일 외식 전 · 상추 토마토 샐러드',m:'약 5분 · 가볍게',e:'🥗',s:'외식 예정',x:['남은 두부 냉동 보관','딸기 먼저 먹기']}];
var $=function(s){return document.querySelector(s)};
function prio(){return S.items.filter(function(i){return i.d<=3}).sort(function(a,b){return a.d-b.d})}
function toast(t){var o=document.createElement('div');o.className='toast';o.textContent=t;document.body.appendChild(o);setTimeout(function(){o.remove()},1800)}
function go(t,v){S.tab=t;S.view=v||'';render();$('#main').scrollTop=0}
function home(){var p=prio().slice(0,3);
return '<div class="row sp"><h1>딱만큼</h1><span style="font-size:22px">🔔</span></div><p class="sub">필요한 만큼 사고, 남김없이 먹다</p>'+
'<p style="font-weight:700;margin-bottom:10px">오늘도 알뜰한 한 끼를 준비해볼까요? 👋</p>'+
'<div class="card" style="background:var(--soft)"><div class="row sp" style="margin-bottom:8px"><b>오늘 먼저 먹어야 할 식재료</b><a onclick="go(\'stock\')" style="color:var(--g);font-size:13px;cursor:pointer">전체보기 ›</a></div><div class="grid3">'+
p.map(function(i){return '<div class="ing"><span class="e">'+i.e+'</span>'+i.n+'<br><span class="d">D-'+i.d+'</span></div>'}).join('')+'</div></div>'+
'<div class="card"><b>⚡ 빠른 실행</b><div class="q" style="margin-top:10px"><button onclick="go(\'home\',\'scan\')"><b>🧾</b>영수증 등록</button><button onclick="go(\'buy\')"><b>🛒</b>적정 구매량 추천</button><button onclick="go(\'recipe\')"><b>🍲</b>상황 맞춤형 레시피</button><button onclick="go(\'stock\')"><b>📅</b>식재료 관리</button></div></div>'+
'<div class="card"><b>🍃 이번 주 음식물 낭비 줄이기</b><div class="row" style="margin-top:12px;gap:18px"><div class="ring" style="--p:72"><i>72%</i></div><div style="flex:1;font-size:14px"><div class="row sp"><span>줄인 쓰레기</span><b>'+S.kg.toFixed(1)+'kg</b></div><div class="row sp" style="margin-top:8px"><span>아낀 식비</span><b>약 '+S.saved.toLocaleString()+'원</b></div></div></div></div>'}
function scan(){var rows=S.rc.map(function(r,i){return '<div class="chk"><span style="font-size:28px">'+r.e+'</span><span class="grow">'+r.n+'</span><span style="color:var(--mute)">'+r.q+' · '+r.p.toLocaleString()+'원</span><input type="checkbox" '+(r.on?'checked':'')+' onchange="S.rc['+i+'].on=this.checked" style="width:20px;height:20px;accent-color:#2f6b3f"></div>'}).join('');
return '<a onclick="go(\'home\')" style="cursor:pointer;color:var(--g);font-weight:700">‹ 홈</a><h2 style="margin-top:8px">영수증으로 간편 등록</h2><p class="sub">촬영하면 식재료와 예상 소비기한(D-day)을 자동으로 채워요.</p>'+
'<div class="scan '+(S.scanned?'':'')+'" id="sc">'+(S.scanned?'🧾 마트 영수증 · 합계 5,800원':'영수증을 화면에 맞춰주세요')+'</div>'+
(S.scanned?'<div class="card"><b>등록할 식재료를 확인해주세요</b>'+rows+'</div><button class="btn" onclick="reg()">등록하기</button>':'<button class="btn" onclick="doScan()">📷 영수증 촬영</button>')}
function doScan(){var s=$('#sc');s.classList.add('go');setTimeout(function(){S.scanned=true;render()},1150)}
function reg(){var n=0;S.rc.forEach(function(r){if(r.on){S.items.push({n:r.n,e:r.e,d:r.d});n++}});S.scanned=false;S.rc.forEach(function(r){r.on=1});toast(n+'개 식재료를 등록했어요');go('stock')}
function stock(){var list=S.sub==='prio'?prio():S.items.slice().sort(function(a,b){return a.d-b.d});
return '<h2>🧊 식재료 관리</h2><p class="sub">먼저 먹어야 할 식재료를 확인하고, 남기지 않고 활용해 보세요.</p>'+
'<div class="seg"><button class="'+(S.sub==='prio'?'on':'')+'" onclick="S.sub=\'prio\';render()">우선 소비 ('+prio().length+')</button><button class="'+(S.sub==='all'?'on':'')+'" onclick="S.sub=\'all\';render()">전체 식재료 ('+S.items.length+')</button></div>'+
(list.length?list.map(function(i){var ix=S.items.indexOf(i);return '<div class="card"><div class="row"><span class="big">'+i.e+'</span><div style="flex:1"><b style="font-size:17px">'+i.n+'</b><div style="font-size:13px;color:var(--mute)">남은 기간 <b>'+i.d+'일</b></div>'+(i.d<=3?'<span class="tag red">먼저 먹어요</span>':'<span class="tag grn">여유 있어요</span>')+'</div></div><div class="row" style="margin-top:10px"><button class="btn s" onclick="eat('+ix+')">✓ 소비 완료</button><button class="btn s o" onclick="toast(\''+i.n+': 냉장 보관, 밀폐 용기 권장\')">보관 방법</button></div></div>'}).join(''):'<div class="card" style="text-align:center">모두 소비했어요! 영수증을 등록해 새 식재료를 추가하세요.</div>')}
function eat(i){var it=S.items[i];S.items.splice(i,1);S.saved+=1000;S.kg=Math.round((S.kg+0.1)*10)/10;toast(it.n+' 소비 완료 · 아낀 식비 +1,000원')  ;render()}
function recipe(){var r=REC[S.sit],p=prio().slice(0,2);
return '<h2>상황 맞춤형 활용 추천</h2><p class="sub">지금의 상황과 보유 식재료에 맞는 활용법을 추천해드려요.</p><b>지금 어떤 상황인가요?</b>'+
'<div class="grid3" style="margin:10px 0 14px">'+['🏠|집에서 식사','⏱|시간이 부족해요','🍴|외식 예정'].map(function(t,i){var a=t.split('|');return '<button onclick="S.sit='+i+';render()" class="ing" style="border:2px solid '+(S.sit===i?'var(--g)':'var(--line)')+';cursor:pointer;font:600 12px \'Noto Sans KR\',sans-serif;color:var(--ink)"><span class="e" style="font-size:24px">'+a[0]+'</span>'+a[1]+'</button>'}).join('')+'</div>'+
'<p style="font-size:13px;color:var(--mute);margin-bottom:6px">우선 소비 식재료로 추천해요</p><div style="margin-bottom:12px">'+p.map(function(i){return '<span class="tag grn" style="margin-right:6px">'+i.e+' '+i.n+' D-'+i.d+'</span>'}).join('')+'</div>'+
'<div class="card"><div class="big" style="text-align:center">'+r.e+'</div><span class="tag grn">'+r.m+'</span><h2 style="margin-top:8px;font-size:18px">'+r.t+'</h2><button class="btn s" style="margin-top:8px" onclick="toast(\'레시피 상세는 다음 버전에서 제공돼요\')">레시피 자세히 보기 ›</button></div>'+
'<b>💡 이런 메뉴도 좋아요!</b><div style="margin-top:8px">'+r.x.map(function(x){return '<span class="tag grn" style="margin:0 6px 6px 0;padding:6px 12px">'+x+'</span>'}).join('')+'</div>'}
function buy(){var one=S.buy==='one';
return '<h2>🛒 AI 적정 구매량 추천</h2><p class="sub">내 식사 계획과 보유 식재료를 고려해 지금 필요한 양을 추천해요.</p>'+
'<div class="card"><div class="row"><span class="big">🧅</span><div><b style="font-size:19px">양파</b><div class="sub" style="margin:0">요리에 자주 쓰는 기본 식재료</div></div></div><div class="row sp" style="margin-top:12px;text-align:center"><div style="flex:1"><small>예상 식사 횟수</small><br><b style="font-size:22px">3회</b></div><div style="flex:1"><small>추천 구매량</small><br><b style="font-size:22px">'+(one?'1개':'3개')+'</b></div></div></div>'+
'<div class="grid3" style="grid-template-columns:1fr 1fr"><div class="opt '+(one?'on':'')+'" onclick="S.buy=\'one\';render()"><b>✔ 필요한 만큼</b><div style="margin:6px 0">🧅 1개 (소포장)<br>약 1,200원</div><small style="color:var(--mute)">식사 횟수에 적합 · 남길 걱정 적음</small></div><div class="opt '+(!one?'on':'')+'" onclick="S.buy=\'bulk\';render()"><b>대용량 구매</b><div style="margin:6px 0">🧅🧅🧅 3개<br>약 3,300원</div><small style="color:var(--mute)">개당 저렴 · 남을 가능성 높음</small></div></div>'+
'<div class="card" style="background:var(--soft);margin-top:12px"><b>💡 AI 추천 이유</b><p style="font-size:13px;margin-top:4px">보유 식재료, 최근 소비 패턴, 계획한 식사 횟수를 고려해 '+(one?'양파 1개가 적절하다고 판단했어요.':'3개를 사면 개당 가격은 낮지만 2개 이상 남을 수 있어요.')+'</p></div>'+
'<button class="btn" onclick="S.cart++;toast(\'장바구니에 담았어요 ('+(S.cart)+')\')">🛒 장바구니에 담기'+(S.cart?' ('+S.cart+')':'')+'</button>'}
function report(){var w=S.range==='week',b=w?[38,31,25,36,43,48,46]:[210,185,232,198],l=w?['월','화','수','목','금','토','일']:['1주','2주','3주','4주'],mx=Math.max.apply(null,b);
var sv=S.saved,sp=w?58200:231400;
return '<h2>식비 및 음식물 낭비 리포트</h2><div class="seg" style="margin-top:8px"><button class="'+(w?'on':'')+'" onclick="S.range=\'week\';render()">주간 리포트</button><button class="'+(!w?'on':'')+'" onclick="S.range=\'month\';render()">월간 리포트</button></div>'+
'<div class="card" style="background:var(--soft)"><b style="font-size:17px">🌱 더 나은 소비를 시작했어요</b></div>'+
'<div class="grid3"><div class="card" style="padding:10px"><small>'+(w?'이번 주':'이번 달')+' 식비</small><br><b style="font-size:17px">'+sp.toLocaleString()+'원</b></div><div class="card" style="padding:10px"><small>절약한 금액</small><br><b style="font-size:17px;color:var(--g)">'+(w?sv:sv*4).toLocaleString()+'원</b></div><div class="card" style="padding:10px"><small>줄인 쓰레기</small><br><b style="font-size:17px;color:var(--g)">'+(w?S.kg:Math.round(S.kg*40)/10).toFixed(1)+'kg</b></div></div>'+
'<div class="card"><b>'+(w?'주간':'월간')+' 식비 추이 (천 원)</b><div class="bars">'+b.map(function(v){return '<div style="height:'+Math.round(v/mx*100)+'%" title="'+v+'"></div>'}).join('')+'</div><div class="lab">'+l.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div></div>'+
'<p style="font-size:11px;color:var(--mute)">※ 절약 금액·감소량은 소비 완료 기록과 기준(직전 4주 평균)을 비교한 샘플 계산이에요.</p>'}
function render(){
 var v={home:S.view==='scan'?scan:home,stock:stock,recipe:recipe,buy:buy,report:report}[S.tab];
 $('#main').innerHTML=v();
 $('#nav').innerHTML=TABS.map(function(t){return '<button class="'+(S.tab===t[0]?'on':'')+'" onclick="go(\''+t[0]+'\')"><span>'+t[1]+'</span>'+t[2]+'</button>'}).join('')}
render();
</script>
</body>
</html>
